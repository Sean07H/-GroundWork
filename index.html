<title>Groundwork</title>

<style>

*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0}
body{background:var(--bg);color:var(--ink);font:600 16px/1.4 Nunito,system-ui,sans-serif;padding:env(safe-area-inset-top) 0 calc(110px + env(safe-area-inset-bottom))}
main{max-width:560px;margin:0 auto;padding:14px 18px}
h1,h2,h3,p{margin:0}

h2{font-size:24px;font-weight:800}
h3{font-size:18px;font-weight:700}
.mute{color:var(--mute);font-size:14px}
.top{display:flex;justify-content:space-between;align-items:center;margin:4px 0 16px}
.logo{font-size:26px;font-weight:800;letter-spacing:-.3px}.logo span{color:var(--amb)}
.pill{display:inline-block;background:var(--card2);color:#cfd4db;border-radius:99px;padding:6px 14px;font-size:14px;font-weight:700}
.chip{display:inline-block;background:var(--tint);color:var(--amb);border:1.5px solid var(--edge);border-radius:99px;padding:6px 15px;font-size:15px;font-weight:700;margin:0 6px 8px 0}
.hero{border:1.5px solid var(--edge);border-radius:28px;padding:18px;background:linear-gradient(165deg,rgba(247,169,39,.12),rgba(247,169,39,.02) 60%),var(--card);box-shadow:0 0 44px rgba(247,169,39,.08);margin:14px 0}
.row{display:flex;align-items:center;gap:12px}
.ico{width:44px;height:44px;border-radius:14px;background:var(--tint);display:grid;place-items:center;color:var(--amb);font-size:20px;flex:none}
.amb{color:var(--amb);font-size:14px;font-weight:700}
.sep{height:1px;background:rgba(255,255,255,.08);margin:14px 0}
.tip{background:rgba(255,255,255,.05);border-radius:18px;padding:12px 14px;margin-bottom:14px;color:#dfe3e8}
.go{display:block;width:100%;border:0;border-radius:20px;background:var(--amb);color:var(--ambInk);font:800 19px Nunito,sans-serif;padding:16px;margin-top:14px}
.go.sm{width:auto;display:inline-block;padding:12px 20px;font-size:16px;margin:0 8px 0 0;border-radius:16px}
.go.alt{background:var(--card2);color:var(--ink)}
.strip{display:grid;grid-template-columns:repeat(7,1fr);gap:4px;text-align:center}
.strip button{background:none;border:0;color:var(--mute);font:700 14px Nunito,sans-serif;padding:0;display:flex;flex-direction:column;align-items:center;gap:6px}
.strip .n{width:42px;height:42px;border-radius:50%;display:grid;place-items:center;font-size:18px;color:var(--ink);border:2px solid transparent}
.strip .today .n{color:var(--amb)}
.strip .on .n{border-color:var(--amb);color:var(--amb)}
.strip i{width:6px;height:6px;border-radius:50%;background:transparent}
.strip .dn i{background:var(--amb)}
.sec{display:flex;align-items:center;gap:12px;color:var(--mute);font-weight:700;margin:22px 0 10px}
.sec::after{content:"";flex:1;height:1px;background:rgba(255,255,255,.08)}
.hist{background:var(--card);border-radius:22px;padding:14px 16px;margin:10px 0;display:flex;justify-content:space-between;align-items:center;gap:10px}
.bar{position:sticky;top:0;z-index:4;background:rgba(10,13,18,.92);backdrop-filter:blur(10px);display:flex;align-items:center;gap:10px;padding:calc(10px + env(safe-area-inset-top)) 18px 10px;margin:0 -18px}
.bar .t{flex:1;font-weight:800;font-size:20px;text-align:center}
.bar button{border:0;border-radius:99px;padding:9px 16px;font:800 15px Nunito,sans-serif}
.ex{background:var(--card);border-radius:26px;padding:16px;margin:14px 0}
.ex.complete{box-shadow:inset 0 0 0 1.5px var(--edge)}
.hd{display:flex;justify-content:space-between;align-items:center;gap:8px}
.hint{color:var(--amb);font-size:14px;margin-top:6px}
.set{display:grid;grid-template-columns:26px 1fr 84px 46px;gap:8px;align-items:center;margin-top:10px}
.set b{color:var(--mute);text-align:center}
input,select{width:100%;padding:11px 12px;border-radius:16px;border:0;background:var(--card2);color:var(--ink);font:700 18px Nunito,sans-serif}
input::placeholder{color:#59616d}
.chk{width:46px;height:46px;border-radius:50%;border:0;background:var(--card2);color:var(--mute);font-size:20px}
.chk.on{background:var(--amb);color:var(--ambInk)}
button:focus-visible,input:focus-visible,select:focus-visible{outline:3px solid var(--amb);outline-offset:2px}
.nt{font-size:15px;margin-top:10px;padding:9px 12px}
.nav{position:fixed;left:0;right:0;bottom:0;display:flex;background:rgba(20,24,31,.96);backdrop-filter:blur(12px);padding:8px 8px calc(8px + env(safe-area-inset-bottom));z-index:5}
.nav button{flex:1;background:none;border:0;color:var(--mute);font:700 12px Nunito,sans-serif;display:flex;flex-direction:column;align-items:center;gap:3px;padding:6px 0}
.nav button.on{color:var(--amb)}
svg.i{width:26px;height:26px;fill:none;stroke:currentColor;stroke-width:1.9;stroke-linecap:round;stroke-linejoin:round}

#rest.show{display:flex}
#rest .t{font-size:30px;font-weight:800;flex:1}
#rest button{background:rgba(0,0,0,.14);border:0;color:inherit;border-radius:14px;padding:10px 14px;font:800 15px Nunito,sans-serif}
.stats{display:grid;grid-template-columns:repeat(3,1fr);gap:10px;margin:14px 0}
.stat{background:var(--card);border-radius:22px;padding:14px}
.stat .n{font-size:32px;font-weight:800;color:var(--amb);line-height:1}
.heat{display:grid;grid-template-columns:repeat(7,1fr);gap:6px;margin:10px 0}
.heat i{aspect-ratio:1;border-radius:50%;background:var(--card2)}
.heat i.l1{background:rgba(247,169,39,.4)}.heat i.l2{background:var(--amb)}
.inl{display:flex;gap:8px;margin-top:12px}
svg.ch{width:100%;height:auto;display:block;margin-top:10px}
.toast{position:fixed;top:calc(12px + env(safe-area-inset-top));left:50%;transform:translateX(-50%);background:var(--amb);color:var(--ambInk);padding:10px 18px;border-radius:99px;font-weight:800;z-index:9;white-space:nowrap}
.big{font-size:40px;font-weight:800;margin:2px 0}
.seg{display:flex;gap:6px;background:var(--card);border-radius:18px;padding:5px}
.seg button{flex:1;border:0;background:none;color:var(--mute);font:700 15px Nunito,sans-serif;padding:11px 4px;border-radius:14px}
.seg button.on{background:var(--amb);color:var(--ambInk)}
.cal{display:grid;grid-template-columns:repeat(7,1fr);gap:4px;text-align:center;margin:6px 0 14px}
.cd{border:0;background:var(--card);color:var(--ink);border-radius:14px;padding:6px 0;font:700 16px Nunito,sans-serif;display:flex;flex-direction:column;align-items:center;min-height:54px}
.cd small{font-size:10px;color:var(--amb);font-weight:700}
.cd.today span{color:var(--amb)}
.cd.on{box-shadow:inset 0 0 0 2px var(--amb)}
.ln{padding:9px 0;border-top:1px solid rgba(255,255,255,.07)}
summary{color:var(--amb);font-weight:700;padding:6px 0;cursor:pointer}
button.pill{border:0;font:inherit;color:inherit}
.gb{background:none;border:0;color:inherit;font:inherit;padding:0;text-align:left}
.gb span{color:var(--amb);font-size:12px}
#gd{position:fixed;inset:0;background:rgba(0,0,0,.62);display:none;align-items:flex-end;z-index:20}
#gd.show{display:flex}
.gs{width:100%;max-width:560px;margin:0 auto;background:var(--card);border-radius:28px 28px 0 0;padding:0 18px calc(18px + env(safe-area-inset-bottom));max-height:92vh;max-height:92dvh;overflow-y:auto;overscroll-behavior:contain;-webkit-overflow-scrolling:touch}
.gs .hd{position:sticky;top:0;z-index:3;background:var(--card);padding:16px 0 8px}
.gs canvas{width:100%;aspect-ratio:16/11;max-height:36vh;max-height:36dvh;background:var(--bg);border-radius:20px;margin:6px 0 10px;display:block;touch-action:none;cursor:grab}
.gs .seg button{padding:9px 2px;font-size:14px}
</style>
</head>

 if(PUSH_URL.includes('PASTE'))return h+'<p class="mute">Set up the Worker first. See SETUP-PUSH.md.</p>';
 if(!sy.on)return h+`<p class="mute" style="margin:0 0 10px">Back up your logs and keep your devices in sync. No account needed, you get a private code.</p><button class="go sm" id="syon" style="margin:0 0 12px">Turn on cloud sync</button><div class="inl"><input id="sycode" type="text" placeholder="Already have a code? Paste it" aria-label="Sync code"><button class="go sm alt" id="syuse" style="margin:0">Use code</button></div>`;
 return h+`<p class="mute" style="margin:0 0 10px">Synced${sy.last?' '+new Date(sy.last).toLocaleString():''}. Anyone with this code can read your logs, so keep it private.</p><input id="sycode" type="text" value="${esc(sy.key)}" readonly aria-label="Your sync code" onfocus="this.select()"><div class="inl" style="margin-top:10px"><button class="go sm" id="sysync" style="margin:0">Sync now</button><button class="go sm alt" id="sycopy" style="margin:0">Copy code</button><button class="go sm alt" id="syoff" style="margin:0">Turn off</button></div>`}
function upUI(){const u=Object.entries(S.up||{});return u.length?'<div class="sec">Level-ups</div>'+u.map(([o,s])=>`<div class="ln"><div>${esc(o)} → ${esc(px(s).n)}</div><button class="pill" style="margin-top:6px" data-undo="${esc(o)}">Undo</button></div>`).join(''):''}
function settings(){
 const seg=(k,o)=>`<div class="seg">${o.map(([v,l])=>`<button data-set="${k}:${v}" class="${String(S[k])===String(v)?'on':''}">${l}</button>`).join('')}</div>`;
 const ld={beginner:'Knee push-ups, floor-based leg work and gentle back work. Three sets of easier moves.',intermediate:'A separate program with more sets and harder moves, like archer push-ups and pistol negatives.',advanced:'Archers, one-arm negatives, pistols, planche leans and long holds. Every level uses only your body and the floor.'};
 return `<h1>Settings</h1><div class="sec">Weight unit</div>${seg('unit',[['kg','kg'],['lb','lb']])}<div class="sec">Difficulty</div>${seg('level',[['beginner','Beginner'],['intermediate','Intermediate'],['advanced','Advanced']])}<p class="mute" style="margin-top:8px">${ld[S.level]}</p><div class="sec">Rest timer</div>${seg('rest',[[0,'Off'],[60,'60 sec'],[90,'90 sec'],[120,'2 min']])}
 ${syncUI()}${remUI()}${upUI()}
 <div class="sec">Backup</div><p class="mute" style="margin:0 0 12px">Your logs live in this browser only. Export a backup before clearing browser data or switching phones.</p>
 <button class="go sm" id="exp">Export backup</button><button class="go sm alt" id="imp">Import backup</button><input type="file" id="file" accept="application/json" hidden>
 <div class="sec">Program</div><p class="mute">Mon push, Tue legs, Wed back, Thu rest, Fri push and core, Sat legs and back, Sun rest. Make a move harder once every set reaches the top of its range. Rest 60–90 sec between sets, 2–3 min on the hardest moves.</p>
 <button class="go sm alt" style="margin-top:18px" id="clr">Delete all logs</button>`;
}

let pm='week',mo=new Date(),ps=today;
function dayCard(k){const p=P[dayOf(k)],h=new Date(k+'T00:00').toLocaleDateString(undefined,{weekday:'long',month:'short',day:'numeric'});
 if(!p)return `<div class="ex"><h3>${h}</h3><p class="mute">Rest day</p></div>`;
 const pl=plan(dayOf(k));return `<div class="ex"><div class="hd"><h3>${p.n}</h3><span class="chip" style="margin:0">${pl.reduce((a,x)=>a+x.s,0)} sets total</span></div><div class="mute" style="margin-bottom:6px">${h}</div>${list(pl)}</div>`}
const lvl=n=>{for(const d in P)for(const l in P[d].e)if(P[d].e[l].some(x=>x.split('|')[0]===n))return cap1(l);return(gd(n)||{}).lv||'Beginner'};
function libInfo(n,g){const m=muscles(n),steps=(g.t.match(/[^.!?]+[.!?]+/g)||[g.t]).map(x=>x.trim()),
 ch=(set,c)=>[...set].map(x=>`<span class="chip" style="border-color:${c};color:${c}">${cap1(x)}</span>`).join('');
 return `<div class="sec">How to do it</div><ol style="margin:0;padding-left:22px">${steps.map(x=>`<li style="margin:6px 0">${esc(x)}</li>`).join('')}</ol>
 ${m.p.size?`<div class="sec">Primary muscles</div>${ch(m.p,'#f7a927')}`:''}${m.s.size?`<div class="sec">Secondary muscles</div>${ch(m.s,'#6cb4ee')}`:''}
 <div style="margin-top:14px"><span class="chip">${lvl(n)}</span>${g.eq?`<span class="chip">Needs: ${esc(g.eq)}</span>`:''}</div>`}
let libQ='',libM='';
const LM=[['','All'],['chest','Chest'],['shoulders','Shoulders'],['rear delts','Rear delts'],['upper back','Upper back'],['lats','Lats'],['lower back','Lower back'],['biceps','Biceps'],['triceps','Triceps'],['forearms','Forearms'],['abs','Abs'],['obliques','Obliques'],['glutes','Glutes'],['quads','Quads'],['hamstrings','Hamstrings'],['calves','Calves']];
function libList(){const q=libQ.trim().toLowerCase(),rows=Object.keys(G).filter(n=>{const g=gd(n);if(!g||!g.a)return false;const m=muscles(n);
  return(!libM||m.p.has(libM))&&(!q||n.toLowerCase().includes(q)||[...m.p,...m.s].some(x=>x.includes(q)))}).sort((a,b)=>a.localeCompare(b));
 return `<div class="mute" style="margin:4px 0 6px">${rows.length} exercise${rows.length===1?'':'s'}</div>`+(rows.map(n=>`<div class="ln" data-g="${esc(n)}" style="display:flex;justify-content:space-between;align-items:center;gap:10px;cursor:pointer"><div><div style="font-weight:700">${esc(n)}</div><div class="mute" style="font-size:14px">${[...muscles(n).p].map(cap1).join(', ')||'Full body'}</div></div><span class="pill" style="flex:none">${lvl(n)}</span></div>`).join('')||'<p class="mute">No matches.</p>')}
function library(){return `<h1>Library</h1><input id="lq" type="search" placeholder="Search exercises or muscles" aria-label="Search exercises" value="${esc(libQ)}" style="margin-top:10px"><div style="display:flex;gap:8px;overflow-x:auto;padding:12px 0 4px">${LM.map(([k,l])=>`<button class="pill" data-lm="${k}" style="flex:none;${libM===k?'background:#f7a927;color:#1a1204':''}">${l}</button>`).join('')}</div><div id="ll">${libList()}</div>`}
function planView(){
 let h=`<h1>Plan</h1><div class="seg" style="margin:12px 0"><button data-pm="week" class="${pm==='week'?'on':''}">Next 7 days</button><button data-pm="month" class="${pm==='month'?'on':''}">Month</button></div>`;
 if(pm==='week'){for(let i=0;i<7;i++){const d=new Date();d.setDate(d.getDate()+i);h+=dayCard(iso(d))}return h}
 const y=mo.getFullYear(),m=mo.getMonth(),n=new Date(y,m+1,0).getDate(),off=(new Date(y,m,1).getDay()+6)%7;
 let c=[...'MTWTFSS'].map(l=>`<div class="mute">${l}</div>`).join('')+'<div></div>'.repeat(off);
 for(let i=1;i<=n;i++){const k=iso(new Date(y,m,i));c+=`<button class="cd ${k===ps?'on ':''}${k===today?'today':''}" data-ps="${k}"><span>${i}</span><small>${AB[dayOf(k)]||''}</small></button>`}
 return h+`<div class="top"><button class="pill" data-mo="-1" aria-label="Previous month">‹</button><h3>${new Date(y,m,1).toLocaleDateString(undefined,{month:'long',year:'numeric'})}</h3><button class="pill" data-mo="1" aria-label="Next month">›</button></div><div class="cal">${c}</div>${dayCard(ps)}`}
let wl=null;
async function wake(on){try{if(on&&!wl&&'wakeLock' in navigator){wl=await navigator.wakeLock.request('screen');wl.addEventListener('release',()=>{wl=null})}else if(!on&&wl){await wl.release();wl=null}}catch(e){}}
document.addEventListener('visibilitychange',()=>{if(document.visibilityState==='visible'&&tab==='log'&&view==='session')wake(true)});
function render(){
 const inS=tab==='log'&&view==='session';wake(inS);
 $('#app').innerHTML=inS?session():tab==='log'?home():tab==='progress'?progress():tab==='body'?body():tab==='plan'?planView():tab==='lib'?library():settings();
 $('#nav').style.display=inS?'none':'flex';
 document.querySelectorAll('#nav button').forEach(b=>b.classList.toggle('on',b.dataset.t===tab));
 clearInterval(clock);
 if(inS){const el=$('#el');const tick=()=>{el.textContent=fmt(Math.floor((Date.now()-t0)/1000))};tick();clock=setInterval(tick,1000)}
 const s=$('#sel');if(s)s.onchange=()=>{sel=s.value;render()};
 if(tab==='progress')drawHeat();else if(hst){hst.dispose();hst=null}
 if(tab==='lib'){const q=$('#lq');if(q)q.oninput=()=>{libQ=q.value;$('#ll').innerHTML=libList()}}
 if(tab==='settings'){
  $('#exp').onclick=()=>{const a=document.createElement('a');a.href=URL.createObjectURL(new Blob([JSON.stringify({log,bw,up:S.up||{}})],{type:'application/json'}));a.download='groundwork-backup-'+today+'.json';a.click()};
  $('#imp').onclick=()=>$('#file').click();
  const rm=$('#rem');if(rm)rm.onclick=()=>remOn($('#remt').value||'18:00').then(render).catch(()=>toast('Could not set up reminders'));
  const ro=$('#remoff');if(ro)ro.onclick=()=>remOff().then(render);
  const so=$('#syon');if(so)so.onclick=()=>{sy={key:rnd(),on:true};sySave();syncNow().then(render)};
  const su=$('#syuse');if(su)su.onclick=()=>{const k=($('#sycode').value||'').trim();if(k.length<16)return toast('That code looks too short');sy={key:k,on:true};sySave();syncNow().then(render)};
  const sn=$('#sysync');if(sn)sn.onclick=()=>syncNow().then(render);
  const sf=$('#syoff');if(sf)sf.onclick=()=>{sy={};sySave();render()};
  const sc=$('#sycopy');if(sc)sc.onclick=()=>navigator.clipboard.writeText(sy.key).then(()=>toast('Code copied'),()=>toast('Copy failed'));
  const rt=$('#remtest');if(rt)rt.onclick=async()=>{const sub=await(await navigator.serviceWorker.ready).pushManager.getSubscription();if(sub)pushPost('/test',sub.toJSON()).then(r=>r.text()).then(t=>toast(t==='201'||t==='200'?'Test sent':'Test failed: '+t))};
  $('#file').onchange=e=>{const f=e.target.files[0];if(f)f.text().then(t=>{try{const o=JSON.parse(t);if(typeof o!=='object'||Array.isArray(o))throw 0;if(o.log){log=o.log;bw=o.bw||[];if(o.up)S.up=o.up}else log=o;save();toast('Backup imported')}catch(x){toast('That file is not a valid backup')}})};
  $('#clr').onclick=()=>{if(confirm('Delete every logged set and weight? This cannot be undone.')){log={};bw=[];for(const d in snap)delete snap[d];persist();if(sy.on)post('/push',{key:sy.key,data:{log:{},bw:[],up:S.up||{}}});toast('Logs deleted')}};
 }
}

let tm=null,left=0;
function startRest(sec){clearInterval(tm);left=sec;$('#rest').classList.add('show');$('#rt').textContent=fmt(left);
 tm=setInterval(()=>{left--;$('#rt').textContent=fmt(Math.max(left,0));if(left<=0){clearInterval(tm);if(navigator.vibrate)navigator.vibrate([200,100,200]);setTimeout(()=>$('#rest').classList.remove('show'),1500)}},1000)}
function stopRest(){clearInterval(tm);$('#rest').classList.remove('show')}
$('#rs').onclick=stopRest;
$('#rp').onclick=()=>{left+=15;$('#rt').textContent=fmt(left)};

$('#nav').onclick=e=>{const b=e.target.closest('button');if(b){tab=b.dataset.t;view='home';render();scrollTo(0,0)}};
$('#app').addEventListener('click',e=>{
 const gb=e.target.closest('[data-g]');if(gb){openGuide(gb.dataset.g);return}
 const k=e.target.closest('[data-k]');if(k){selDate=k.dataset.k;render();return}
 const pmb=e.target.closest('[data-pm]');if(pmb){pm=pmb.dataset.pm;render();return}
 const mb=e.target.closest('[data-mo]');if(mb){mo=new Date(mo.getFullYear(),mo.getMonth()+ +mb.dataset.mo,1);render();return}
 const psb=e.target.closest('[data-ps]');if(psb){ps=psb.dataset.ps;render();return}
 const st=e.target.closest('[data-set]');if(st){const[k2,v2]=st.dataset.set.split(':');S[k2]=k2==='rest'?+v2:v2;save();render();return}
 const lm=e.target.closest('[data-lm]');if(lm){libM=lm.dataset.lm;const y=scrollY;render();scrollTo(0,y);return}
 const up=e.target.closest('[data-up]');if(up){const x=todays()[+up.dataset.up],nx=nextEx(x.n);S.up=S.up||{};const o=Object.keys(S.up).find(k=>px(S.up[k]).n===x.n)||x.n;S.up[o]=promoSpec(x,nx);save();toast('Moved up to '+nx);const y=scrollY;render();scrollTo(0,y);return}
 const un=e.target.closest('[data-undo]');if(un){delete S.up[un.dataset.undo];save();render();return}
 if(e.target.closest('[data-wu]')){const d=sd();log[d]=log[d]||{};log[d]._wu=!log[d]._wu;save();const y=scrollY;render();scrollTo(0,y);return}
 const sw=e.target.closest('[data-swap]');if(sw){const i=+sw.dataset.swap;swapI=swapI===i?-1:i;const y=scrollY;render();scrollTo(0,y);return}
 const pk=e.target.closest('[data-pick]');if(pk){const d=sd(),i=pk.dataset.pick;log[d]=log[d]||{};const m=log[d]._sw=log[d]._sw||{};if(pk.dataset.spec)m[i]=pk.dataset.spec;else delete m[i];swapI=-1;save();const y=scrollY;render();scrollTo(0,y);return}
 const g=e.target.closest('[data-go]');
 if(g){const a=g.dataset.go;
  if(a==='start'){view='session';t0=Date.now()}
  else if(a==='back'){view='home';stopRest()}
  else if(a==='finish'){const d=sd();if(nDone(d)){log[d]._day=P[dayOf(selDate)].n;save();toast('Workout saved')}view='home';stopRest()}
  render();scrollTo(0,0);return}
 if(e.target.closest('[data-act=bw]')){const v=parseFloat($('#kg').value);if(!(v>0)){toast('Enter your weight in '+U()+'');return}
  bw=bw.filter(b=>b.d!==today);bw.push({d:today,kg:Math.round(fromU(v)*100)/100});bw.sort((a,b)=>a.d<b.d?-1:1);save();render();toast('Weight saved');return}
 const c=e.target.closest('.chk');if(!c)return;
 const p=P[dayOf(selDate)],d=sd(),x=todays()[+c.dataset.i],j=+c.dataset.j;
 log[d]=log[d]||{};const arr=log[d][x.n]=sets(d,x.n).slice();
 while(arr.length<x.s)arr.push({});
 const s=arr[j]=arr[j]||{};
 if(s.done)s.done=false;
 else{const row=c.closest('.set'),vi=row.querySelector('[data-f=v]'),wi=row.querySelector('[data-f=w]');
  s.v=+vi.value||(+vi.placeholder)||(x.r==='max'?0:x.r[0]);s.w=fromU(+wi.value||0);s.done=true;log[d]._day=p.n;
  if(isPR(x.n,s))toast('New personal best: '+x.n);
  if(S.rest)startRest(S.rest+(x.rest?x.rest-90:0))}
 save();const y=scrollY;render();scrollTo(0,y);
});
$('#app').addEventListener('change',e=>{
 const i=e.target;
 if(i.dataset&&i.dataset.note!==undefined){const x=todays()[+i.dataset.note],d=sd();log[d]=log[d]||{};(log[d]._notes=log[d]._notes||{})[x.n]=i.value.trim();save();return}
 if(!i.dataset||!i.dataset.f)return;
 const p=P[dayOf(selDate)],d=sd(),x=todays()[+i.dataset.i],j=+i.dataset.j;
 log[d]=log[d]||{};const arr=log[d][x.n]=sets(d,x.n).slice();
 while(arr.length<x.s)arr.push({});
 const s=arr[j]=arr[j]||{};s[i.dataset.f]=i.dataset.f==='w'?fromU(+i.value||0):(+i.value||0);save();
});
if('serviceWorker' in navigator)addEventListener('load',()=>navigator.serviceWorker.register('sw.js').catch(()=>{}));
render();
syncNow(true);
</script>
</body>
</html>
